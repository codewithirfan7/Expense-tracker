{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <h4 class="mb-3">Create account</h4>
      <form method="post">
        <div class="mb-3"><label class="form-label">Username (min 3 characters)</label>
          <input class="form-control" name="username" required minlength="3" autofocus></div>
        <div class="mb-3"><label class="form-label">Password (min 6 characters)</label>
          <input class="form-control" type="password" name="password" required minlength="6"></div>
        <button class="btn btn-success w-100">Register</button>
      </form>
      <p class="mt-3 mb-0 small">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
