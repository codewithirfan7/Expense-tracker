{% extends "base.html" %}
{% block title %}{{ 'Edit' if tx else 'Add' }} transaction{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm"><div class="card-body">
      <h4 class="mb-3">{{ 'Edit' if tx else 'Add' }} transaction</h4>
      <form method="post">
        <div class="mb-3">
          <label class="form-label d-block">Type</label>
          {% for k in ['expense', 'income'] %}
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="kind" id="k-{{ k }}" value="{{ k }}"
              {{ 'checked' if (tx and tx['kind'] == k) or (not tx and k == 'expense') }}>
            <label class="form-check-label" for="k-{{ k }}">{{ k.title() }}</label>
          </div>
          {% endfor %}
        </div>
        <div class="mb-3"><label class="form-label">Category</label>
          <select class="form-select" name="category">
            {% for c in categories %}
              <option {{ 'selected' if tx and tx['category'] == c }}>{{ c }}</option>
            {% endfor %}
          </select></div>
        <div class="mb-3"><label class="form-label">Amount</label>
          <input class="form-control" type="number" step="0.01" min="0.01" name="amount"
                 value="{{ tx['amount'] if tx }}" required></div>
        <div class="mb-3"><label class="form-label">Date</label>
          <input class="form-control" type="date" name="tx_date"
                 value="{{ tx['tx_date'] if tx else today }}" required></div>
        <div class="mb-3"><label class="form-label">Note (optional)</label>
          <input class="form-control" name="note" maxlength="200" value="{{ tx['note'] if tx }}"></div>
        <button class="btn btn-primary">Save</button>
        <a class="btn btn-link" href="{{ url_for('dashboard') }}">Cancel</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
