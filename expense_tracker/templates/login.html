{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm"><div class="card-body">
      <h4 class="mb-3">Log in</h4>
      <form method="post">
        <div class="mb-3"><label class="form-label">Username</label>
          <input class="form-control" name="username" required autofocus></div>
        <div class="mb-3"><label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" required></div>
        <button class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="mt-3 mb-0 small">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
